name: flutter_application_1
description: "Interactive Counter app implemented twice: GetX and Riverpod 2.x."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management implementation A.
  get: ^4.7.2

  # State management implementation B (pinned to the 2.x API generation).
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Lets timer tests run on simulated time instead of real seconds.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
